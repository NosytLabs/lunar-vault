name: Lunar Vault code and asset checks
on:
  pull_request:
    paths:
      - 'apps/lunar-vault/**'
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.ts'
      - '.github/workflows/lunar-vault-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lunar-vault-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: corepack enable
      - run: corepack prepare pnpm@10.5.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 tools/generate-audio.py
      - run: node tools/check-original-art.mjs
      - run: python3 tools/audit-assets.py
      - run: pnpm run build --filter=lunar-vault
      # This runner already supplies Chromium's shared libraries and Latin fonts.
      # Avoid upgrading unrelated OS/font packages through a slow Ubuntu mirror.
      - name: Install headless Chromium
        timeout-minutes: 3
        run: pnpm exec playwright install --only-shell chromium
      - run: pnpm run test:viewport
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-vault-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-vault-preview
          path: apps/lunar-vault/build/
          if-no-files-found: error
          retention-days: 3
