name: Lunar Vault verification

on:
  pull_request:
    paths:
      - 'apps/lunar-vault/**'
      - 'packages/**'
      - 'tools/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lunar-vault-ci.yml'
  workflow_dispatch:

concurrency:
  group: lunar-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Engine static frontend
        run: pnpm run build --filter=lunar-vault
      - name: Audit every referenced asset
        run: python3 tools/audit-assets.py
      - name: Verify NosytLabs image integrity and loader
        run: python3 tools/verify-nosyt-assets.py
