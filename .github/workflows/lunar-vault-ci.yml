name: Lunar Vault verification

on:
  pull_request:
    paths:
      - 'apps/lunar-vault/**'
      - 'packages/**'
      - 'tools/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lunar-vault-ci.yml'
  workflow_dispatch:

concurrency:
  group: lunar-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Engine static frontend
        run: pnpm run build --filter=lunar-vault
      - name: Audit every referenced asset
        run: python3 tools/audit-assets.py
      - name: Verify NosytLabs image integrity and loader
        run: python3 tools/verify-nosyt-assets.py
      - name: Capture static build for off-line visual QA
        uses: actions/upload-artifact@v4
        with:
          name: lunar-vault-static-preview
          path: apps/lunar-vault/build/
          if-no-files-found: error
          retention-days: 1
      - name: Install browser test driver
        run: python3 -m pip install --quiet playwright==1.55.0
      - name: Capture five QA viewports (simulated session, no bets)
        run: python3 tools/capture-visual-qa.py
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-vault-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 1
